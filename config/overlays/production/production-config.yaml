apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
spec:
  template:
    spec:
      containers:
      - name: manager
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: MODEL_TRANSPARENCY_CLI_IMAGE
          value: "ghcr.io/sigstore/model-transparency-cli:latest"