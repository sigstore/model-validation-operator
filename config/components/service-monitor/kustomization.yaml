apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# This component enables automatic ServiceMonitor creation for Prometheus/OpenShift.
# It adds the --enable-service-monitor flag and POD_NAMESPACE env var to the controller manager,
# and grants RBAC for managing ServiceMonitor resources.
patches:
- target:
    kind: Deployment
    name: controller-manager
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --enable-service-monitor
    - op: add
      path: /spec/template/spec/containers/0/env
      value:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace

resources:
- servicemonitor_rbac.yaml
