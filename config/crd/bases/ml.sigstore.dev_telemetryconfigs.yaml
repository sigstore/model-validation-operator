                    - always_off
                    - traceidratio
                    - parentbased_always_on
                    - parentbased_always_off
                    - parentbased_traceidratio
                    type: string
                  samplerArg:
                    description: |-
                      SamplerArg is the argument for the sampler (sets OTEL_TRACES_SAMPLER_ARG).
                      For example, "0.1" for a 10% sampling ratio with traceidratio.
