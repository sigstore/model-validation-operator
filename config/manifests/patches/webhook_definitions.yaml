# JSON6902 patch applied to the generated CSV by `make generate-bundle`, after
# `operator-sdk generate bundle` derives spec.webhookdefinitions from the
# MutatingWebhookConfiguration in config/webhook. Operator SDK already gets the
# rules, selectors, failure policy and deployment name right; only the port
# and service wiring need correcting, so nothing else is duplicated here.
#
# The `test` op makes generation fail loudly if a webhook is added or
# reordered, instead of silently patching the wrong entry.
- op: test
  path: /spec/webhookdefinitions/0/generateName
  value: pods.validation.ml.sigstore.dev
- op: replace
  path: /spec/webhookdefinitions/0/containerPort
  value: 9443
- op: remove
  path: /spec/webhookdefinitions/0/targetPort
- op: add
  path: /spec/webhookdefinitions/0/serviceName
  value: model-validation-webhook
