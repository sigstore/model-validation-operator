name: E2E Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test-e2e:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Create Kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1
        with:
          cluster_name: kind

      - name: Wait for Kind cluster to be ready
        run: |
          kubectl wait --for=condition=Ready nodes --all --timeout=300s
          kubectl wait --for=condition=Ready --namespace=kube-system pod --all --timeout=300s
          echo "Cluster is ready"

      - name: Run E2E tests
        run: make test-e2e-ci

  test-e2e-olm-upgrade:
    name: Test OLM Upgrade
    runs-on: ubuntu-latest
    env:
      CONTAINER_TOOL: podman
      IMG: ghcr.io/sigstore/model-validation-operator:dev-${{ github.sha }}
      AGENT_IMG: ghcr.io/sigstore/model-validation-operator-agent:dev-${{ github.sha }}
      BUNDLE_IMG: ghcr.io/sigstore/model-validation-operator-bundle:dev-${{ github.sha }}
      CATALOG_IMG: ghcr.io/sigstore/model-validation-operator-catalog:dev-${{ github.sha }}
      BASE_IMG: ghcr.io/sigstore/model-validation-operator:olm-base-${{ github.sha }}
      BASE_AGENT_IMG: ghcr.io/sigstore/model-validation-operator-agent:olm-base-${{ github.sha }}
      BASE_BUNDLE_IMG: ghcr.io/sigstore/model-validation-operator-bundle:olm-base-${{ github.sha }}
      BASE_CATALOG_IMG: ghcr.io/sigstore/model-validation-operator-catalog:olm-base-${{ github.sha }}
    steps:
      - name: Checkout source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        uses: actions/setup-go@def8c394e3ad351a79bc93815e4a585520fe993b # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Create Kind cluster with local registry
        id: kind
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1
        with:
          cluster_name: kind
          registry: true
          registry_name: kind-registry
          registry_port: 5000

      - name: Wait for Kind cluster to be ready
        run: |
          kubectl wait --for=condition=Ready nodes --all --timeout=300s
          kubectl wait --for=condition=Ready --namespace=kube-system pod --all --timeout=300s

      - name: Configure local registry access
        run: |
          LOCAL_REGISTRY=kind-registry:5000
          echo "LOCAL_REGISTRY=$LOCAL_REGISTRY" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.config/containers/registries.conf.d"
          cat > "$HOME/.config/containers/registries.conf.d/kind-local-registry.conf" <<EOF
          [[registry]]
          location = "$LOCAL_REGISTRY"
          insecure = true
          EOF

          for attempt in {1..30}; do
            if curl --fail --silent "http://$LOCAL_REGISTRY/v2/" >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent "http://$LOCAL_REGISTRY/v2/" >/dev/null

      - name: Compute OLM upgrade versions
        run: |
          CURRENT=$(grep '^VERSION ?=' Makefile | cut -d= -f2 | tr -d ' ')
          NEXT=$(echo "$CURRENT" | awk -F. '{print $1"."$2"."$3+1}')
          echo "OLM_BASE_VERSION=$CURRENT" >> "$GITHUB_ENV"
          echo "OLM_UPGRADE_VERSION=$NEXT" >> "$GITHUB_ENV"

      - name: Set local OLM image references
        run: |
          echo "BASE_IMG_LOCAL=$LOCAL_REGISTRY/${BASE_IMG#ghcr.io/}" >> "$GITHUB_ENV"
          echo "BASE_AGENT_IMG_LOCAL=$LOCAL_REGISTRY/${BASE_AGENT_IMG#ghcr.io/}" >> "$GITHUB_ENV"
          echo "IMG_LOCAL=$LOCAL_REGISTRY/${IMG#ghcr.io/}" >> "$GITHUB_ENV"
          echo "AGENT_IMG_LOCAL=$LOCAL_REGISTRY/${AGENT_IMG#ghcr.io/}" >> "$GITHUB_ENV"
          echo "BASE_BUNDLE_IMG_LOCAL=$LOCAL_REGISTRY/${BASE_BUNDLE_IMG#ghcr.io/}" >> "$GITHUB_ENV"
          echo "BUNDLE_IMG_LOCAL=$LOCAL_REGISTRY/${BUNDLE_IMG#ghcr.io/}" >> "$GITHUB_ENV"
          echo "BASE_CATALOG_IMG_LOCAL=$LOCAL_REGISTRY/${BASE_CATALOG_IMG#ghcr.io/}" >> "$GITHUB_ENV"
          echo "CATALOG_IMG_LOCAL=$LOCAL_REGISTRY/${CATALOG_IMG#ghcr.io/}" >> "$GITHUB_ENV"

      - name: Build base operator image
        run: |
          make docker-build docker-build-agent IMG="$BASE_IMG_LOCAL" AGENT_IMG="$BASE_AGENT_IMG_LOCAL"
          podman push --tls-verify=false "$BASE_IMG_LOCAL"
          podman push --tls-verify=false "$BASE_AGENT_IMG_LOCAL"

      - name: Build target operator image
        run: |
          make docker-build docker-build-agent IMG="$IMG_LOCAL" AGENT_IMG="$AGENT_IMG_LOCAL"
          podman push --tls-verify=false "$IMG_LOCAL"
          podman push --tls-verify=false "$AGENT_IMG_LOCAL"

      - name: Build base bundle
        run: |
          make bundle bundle-build IMG="$BASE_IMG_LOCAL" AGENT_IMG="$BASE_AGENT_IMG_LOCAL" BUNDLE_IMG="$BASE_BUNDLE_IMG_LOCAL" VERSION=$OLM_BASE_VERSION CHANNELS=tech-preview DEFAULT_CHANNEL=tech-preview
          podman push --tls-verify=false "$BASE_BUNDLE_IMG_LOCAL"

      - name: Build target bundle
        run: |
          make bundle bundle-build IMG="$IMG_LOCAL" AGENT_IMG="$AGENT_IMG_LOCAL" BUNDLE_IMG="$BUNDLE_IMG_LOCAL" VERSION=$OLM_UPGRADE_VERSION CHANNELS=tech-preview DEFAULT_CHANNEL=tech-preview
          podman push --tls-verify=false "$BUNDLE_IMG_LOCAL"

      - name: Build base and target catalogs
        run: |
          make opm
          make catalog-build CATALOG_IMG="$BASE_CATALOG_IMG_LOCAL" BUNDLE_IMGS="$BASE_BUNDLE_IMG_LOCAL"
          podman push --tls-verify=false "$BASE_CATALOG_IMG_LOCAL"
          make catalog-build CATALOG_IMG="$CATALOG_IMG_LOCAL" BUNDLE_IMGS="$BUNDLE_IMG_LOCAL" CATALOG_BASE_IMG="$BASE_CATALOG_IMG_LOCAL"
          podman push --tls-verify=false "$CATALOG_IMG_LOCAL"

      - name: Install OLM
        run: make e2e-install-olm

      - name: Setup OLM test namespaces
        run: make e2e-setup-namespaces

      - name: Run OLM upgrade tests
        env:
          TEST_BASE_CATALOG: kind-registry:5000/sigstore/model-validation-operator-catalog:olm-base-${{ github.sha }}
          TEST_TARGET_CATALOG: kind-registry:5000/sigstore/model-validation-operator-catalog:dev-${{ github.sha }}
        run: go test ./test/e2e-olm/ -v -ginkgo.v -timeout 20m

      - name: Clean up local registry configuration
        if: always()
        run: |
          rm -f "$HOME/.config/containers/registries.conf.d/kind-local-registry.conf"
