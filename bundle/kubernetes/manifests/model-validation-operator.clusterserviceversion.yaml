apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  annotations:
    alm-examples: |-
      [
        {
          "apiVersion": "ml.sigstore.dev/v1alpha1",
          "kind": "ModelValidation",
          "metadata": {
            "labels": {
              "app.kubernetes.io/managed-by": "kustomize",
              "app.kubernetes.io/name": "model-validation-operator"
            },
            "name": "modelvalidation-sample",
            "namespace": "model-validation-operator-system"
          },
          "spec": null
        }
      ]
    capabilities: Seamless Upgrades
    containerImage: ghcr.io/sigstore/model-validation-operator:v1.0.0
    createdAt: "2026-11-11T12:01:34Z"
    operators.operatorframework.io/builder: operator-sdk-v1.42.0
    operators.operatorframework.io/project_layout: go.kubebuilder.io/v4
  name: model-validation-operator.v1.0.0
  namespace: model-validation-operator-system
spec:
  apiservicedefinitions: {}
  customresourcedefinitions:
    owned:
    - description: ModelValidation is the Schema for the modelvalidations API.
      displayName: Model Validation
      kind: ModelValidation
      name: modelvalidations.ml.sigstore.dev
      version: v1alpha1
    - description: |-
        TelemetryConfig is the Schema for the telemetryconfigs API.
        It defines OpenTelemetry configuration that the operator injects into
        validation agent containers via environment variables.
      displayName: Telemetry Config
      kind: TelemetryConfig
      name: telemetryconfigs.ml.sigstore.dev
      version: v1alpha1
  description: Model Validation Operator helps protect machine learning workloads
    by verifying model artifacts before containers use them. A Kubernetes admission
    webhook injects a validation init container based on a ModelValidation resource.
    It supports Sigstore signatures, public-key verification, and certificate-based
    verification to help teams check model integrity and provenance during workload
    deployment.
  displayName: Model Validation Operator
  icon:
  - base64data: 
    mediatype: image/svg+xml
  install:
    spec:
      clusterPermissions:
      - rules:
        - apiGroups:
          - ""
          resources:
          - namespaces
          verbs:
          - get
          - list
          - watch
        - apiGroups:
          - ""
          resources:
          - pods
          verbs:
          - get
          - list
          - update
          - watch
        - apiGroups:
          - ""
          resources:
          - pods/finalizers
          verbs:
          - update
        - apiGroups:
          - ml.sigstore.dev
          resources:
          - modelvalidations
          - telemetryconfigs
          verbs:
          - get
          - list
          - watch
        - apiGroups:
          - ml.sigstore.dev
          resources:
          - modelvalidations/status
          - telemetryconfigs/status
          verbs:
          - update
        - apiGroups:
          - monitoring.coreos.com
          resources:
          - servicemonitors
          verbs:
          - create
          - delete
          - get
          - list
          - update
          - watch
        - apiGroups:
          - networking.k8s.io
          resources:
          - networkpolicies
          verbs:
          - create
          - get
          - patch
          - update
        - apiGroups:
          - authentication.k8s.io
          resources:
          - tokenreviews
          verbs:
          - create
        - apiGroups:
          - authorization.k8s.io
          resources:
          - subjectaccessreviews
          verbs:
          - create
        serviceAccountName: model-validation-controller-manager
      deployments:
      - label:
          app.kubernetes.io/managed-by: kustomize
          app.kubernetes.io/name: model-validation-operator
          control-plane: controller-manager
        name: model-validation-controller-manager
        spec:
          replicas: 1
          selector:
            matchLabels:
              app.kubernetes.io/name: model-validation-operator
              control-plane: controller-manager
          strategy: {}
          template:
            metadata:
              annotations:
                kubectl.kubernetes.io/default-container: manager
              labels:
                app.kubernetes.io/name: model-validation-operator
                control-plane: controller-manager
            spec:
              containers:
              - args:
                - --metrics-bind-address=:8443
                - --leader-elect
                - --health-probe-bind-address=:8081
                command:
                - /manager
                env:
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                image: ghcr.io/sigstore/model-validation-operator:v1.0.0
                livenessProbe:
                  httpGet:
                    path: /healthz
                    port: 8081
                  initialDelaySeconds: 15
                  periodSeconds: 20
                name: manager
                ports:
                - containerPort: 9443
                  name: webhook-server
                  protocol: TCP
                readinessProbe:
                  httpGet:
                    path: /readyz
                    port: 8081
                  initialDelaySeconds: 5
                  periodSeconds: 10
                resources:
                  limits:
                    cpu: 500m
                    memory: 256Mi
                  requests:
                    cpu: 10m
                    memory: 64Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                    - ALL
                  readOnlyRootFilesystem: true
              securityContext:
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
              serviceAccountName: model-validation-controller-manager
              terminationGracePeriodSeconds: 10
      permissions:
      - rules:
        - apiGroups:
          - ""
          resources:
          - configmaps
          verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        - apiGroups:
          - coordination.k8s.io
          resources:
          - leases
          verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        - apiGroups:
          - ""
          resources:
          - events
          verbs:
          - create
          - patch
        serviceAccountName: model-validation-controller-manager
    strategy: deployment
  installModes:
  - supported: false
    type: OwnNamespace
  - supported: false
    type: SingleNamespace
  - supported: false
    type: MultiNamespace
  - supported: true
    type: AllNamespaces
  keywords:
  - model signing
  - signing
  - ai
  links:
  - name: Model Validation Operator
    url: https://github.com/sigstore/model-validation-operator
  maintainers:
  - email: nolear@redhat.com
    name: Nina Bongartz
  - email: ryordan@redhat.com
    name: Rachel Yordan
  - email: ifont@redhat.com
    name: Ivan Font
  maturity: stable
  minKubeVersion: 1.24.0
  provider:
    name: Sigstore
    url: https://sigstore.dev/
  version: 1.0.0
  webhookdefinitions:
  - admissionReviewVersions:
    - v1
    deploymentName: model-validation-controller-manager
    containerPort: 9443
    serviceName: model-validation-webhook
    failurePolicy: Fail
    generateName: pods.validation.ml.sigstore.dev
    objectSelector:
      matchExpressions:
      - key: validation.ml.sigstore.dev/ml
        operator: Exists
    rules:
    - apiGroups:
      - ""
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
    sideEffects: None
    type: MutatingAdmissionWebhook
    webhookPath: /mutate-v1-pod
